[package]
name = "web-arena-indigo"
version = "0.2.1"
edition = "2024"
rust-version = "1.86"
authors = ["uiuifree"]
description = "Unofficial async client for the WebARENA Indigo VPS API (NTTPC): instances, SSH keys, firewalls, snapshots, DNS"
license = "MIT"
repository = "https://github.com/uiuifree/rust-web-arena-indigo"
homepage = "https://github.com/uiuifree/rust-web-arena-indigo"
documentation = "https://docs.rs/web-arena-indigo"
readme = "README.md"
keywords = ["webarena", "indigo", "vps", "nttpc", "api"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
dotenv = "0.15.0"
mockito = "1"
